<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="kevin.es">
  <!-- Dreht sich mit der Leiste des Browsers: dunkles Zeichen auf hellem Tab,
       helles auf dunklem. Sonst verschwindet das Icon in einer der beiden Welten. -->
  <style>
    .platte { fill: #18181b }
    .zeichen { fill: #ffffff }
    @media (prefers-color-scheme: dark) {
      .platte { fill: #ededf1 }
      .zeichen { fill: #0c0d0f }
    }
  </style>
  <rect class="platte" width="64" height="64" rx="14" />
  <text class="zeichen" x="32" y="45.5" text-anchor="middle"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="34" font-weight="700" letter-spacing="-1.5">es</text>
</svg>
